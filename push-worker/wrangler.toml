name = "rituel-push"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Push scheduling: five-minute scan, with de-duplication by device/day/type.
[triggers]
crons = ["*/5 * * * *"]

# Create a D1 database named rituel-push-db, then replace the UUID below.
[[d1_databases]]
binding = "DB"
database_name = "rituel-push-db"
database_id = "7588e3e1-ebb7-4c15-b47e-e28533dc34ae"
migrations_dir = "migrations"
